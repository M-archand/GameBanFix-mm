# Releases are run by hand

name: Build & Release

on:
  workflow_dispatch:

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve the tag from version.h
        id: resolve
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # One source of truth for the version, bumped by hand in the source.
          version="$(sed -n 's/^#define GAMEBANFIX_VERSION[[:space:]]*"\([^"]*\)".*$/\1/p' version.h)"
          if [ -z "$version" ]; then
            echo "::error file=version.h::Could not read GAMEBANFIX_VERSION from version.h."
            exit 1
          fi
          tag="v$version"

          # Asked of GitHub rather than the local clone, so the answer is what
          # is actually published no matter what this checkout fetched.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            {
              echo "### Release $tag already exists"
              echo
              echo "Version \`$version\` has already been published, so this run cannot release it again."
              echo "Bump \`GAMEBANFIX_VERSION\` in \`version.h\` to the next version, push that, then run this workflow again."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error file=version.h::Version $version already exists as tag $tag. Bump GAMEBANFIX_VERSION in version.h and run again."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $tag; the release job creates the tag once the builds pass."
          echo "Building **$tag** from \`version.h\`." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: version
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: windows-latest
          - os: ubuntu-latest
            container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: ${{ github.event.repository.name }}
          submodules: recursive
          fetch-depth: 0

      - name: Checkout Metamod
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/metamod-source
          ref: master
          path: mmsource-2.0
          submodules: recursive

      - name: Checkout HL2SDK
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/hl2sdk
          ref: cs2
          path: hl2sdk-cs2

      - name: Checkout AMBuild
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/ambuild
          path: ambuild

      - name: Install AMBuild
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            pip install setuptools
          fi
          cd ambuild && python setup.py install && cd ..

      - name: Install Clang 21
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "deb http://apt.llvm.org/bullseye/ llvm-toolchain-bullseye-21 main" >> /etc/apt/sources.list.d/llvm.list
          echo "deb-src http://apt.llvm.org/bullseye/ llvm-toolchain-bullseye-21 main" >> /etc/apt/sources.list.d/llvm.list
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          apt update && apt install -y clang-21
          ln -sf /usr/bin/clang-21 /usr/bin/clang && ln -sf /usr/bin/clang++-21 /usr/bin/clang++

      - name: Build
        working-directory: ${{ github.event.repository.name }}
        shell: bash
        run: |
          mkdir build && cd build
          python ../configure.py --enable-optimize --symbol-files --sdks cs2
          ambuild

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}
          path: ${{ github.event.repository.name }}/build/package

  release:
    name: Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create the tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.tag }}
          NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          if [ -d "artifacts/Linux" ]; then
            ( cd artifacts/Linux && zip -qr "$GITHUB_WORKSPACE/${NAME}-${VERSION}-linux.zip" * )
          fi
          if [ -d "artifacts/Windows" ]; then
            ( cd artifacts/Windows && zip -qr "$GITHUB_WORKSPACE/${NAME}-${VERSION}-windows.zip" * )
          fi

      - name: Build release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              found && /^##+ \[/ { exit }
              $0 ~ ("^##+ \\[" ver "\\]") { found=1; next }
              found { print }
            ' CHANGELOG.md > release_notes.md
          else
            : > release_notes.md
          fi

          if [ ! -s release_notes.md ]; then
            echo "::warning file=CHANGELOG.md::No CHANGELOG.md entry for $VERSION; releasing with a placeholder body."
            echo "Release $TAG" > release_notes.md
          fi

          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat release_notes.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ github.event.repository.name }}-*
          tag: ${{ needs.version.outputs.tag }}
          file_glob: true
          overwrite: true
          release_name: ${{ needs.version.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
